<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether Weather</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="theme-day">

  <!-- Canvas for animated backgrounds -->
  <canvas id="bg-canvas"></canvas>

  <!-- Main App Wrapper -->
  <div id="app">

    <!-- Search & Header Bar -->
    <header class="app-header">
      <div class="header-left">
        <span class="app-logo">⬡</span>
      </div>
      <div class="search-container">
        <form id="search-form" class="search-bar glass">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="text" id="search-input" placeholder="City" autocomplete="off" spellcheck="false" />
          <button id="search-btn" class="search-submit">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </form>
        <div id="search-suggestions" class="search-suggestions glass"></div>
      </div>
      <div class="header-right">
        <button id="location-btn" class="icon-btn glass" aria-label="location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z"/><circle cx="12" cy="9" r="2.5"/>
          </svg>
        </button>
        <button id="favorites-toggle" class="icon-btn glass" aria-label="favorites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Loading State -->
    <div id="loading-screen" class="loading-screen">
      <div class="loader-ring"></div>
      <p class="loading-text">Fetching your sky…</p>
    </div>

    <!-- Error State -->
    <div id="error-screen" class="error-screen hidden">
      <div class="error-icon">⚠</div>
      <h2 id="error-title">Error</h2>
      <p id="error-msg">Unable to load.</p>
      <button id="retry-btn" class="btn-primary">Retry</button>
    </div>

    <!-- Main Weather Dashboard -->
    <main id="dashboard" class="dashboard hidden">

      <!-- Left / Primary Column -->
      <section class="col-primary">

        <!-- Hero Card: Current Weather -->
        <div class="card hero-card glass float-anim" id="hero-card">
          <div class="hero-top">
            <div class="hero-location">
              <h1 class="city-name" id="city-name">—</h1>
              <p class="local-time" id="local-time">—</p>
            </div>
            <div class="hero-icon-wrap">
              <canvas id="weather-icon-canvas" width="120" height="120"></canvas>
            </div>
          </div>
          <div class="hero-temp-row">
            <span class="hero-temp" id="hero-temp">—</span>
            <div class="hero-meta">
              <span class="feels-like" id="feels-like">🌡 —</span>
              <span class="condition-text" id="condition-text">—</span>
            </div>
          </div>
          <div class="hero-stats-row" id="hero-stats">
            <div class="stat-pill glass">
              <span class="stat-icon">💧</span>
              <span class="stat-val" id="stat-humidity">—</span>
            </div>
            <div class="stat-pill glass">
              <span class="stat-icon">💨</span>
              <span class="stat-val" id="stat-wind">—</span>
            </div>
            <div class="stat-pill glass">
              <span class="stat-icon">👁</span>
              <span class="stat-val" id="stat-vis">—</span>
            </div>
            <div class="stat-pill glass">
              <span class="stat-icon">🌡</span>
              <span class="stat-val" id="stat-pressure">—</span>
            </div>
          </div>
          <button id="fav-this-btn" class="fav-btn" title="Add to favorites">☆ Add to Favorites</button>
        </div>

        <!-- Hourly Forecast -->
        <div class="card glass" id="hourly-card">
          <h3 class="card-title">⏱</h3>
          <div class="hourly-scroll" id="hourly-list"></div>
        </div>

        <!-- 7-Day Forecast -->
        <div class="card glass" id="forecast-card">
          <h3 class="card-title">7-Day Forecast</h3>
          <div id="forecast-list" class="forecast-list"></div>
        </div>

      </section>

      <!-- Right / Secondary Column -->
      <section class="col-secondary">

        <!-- Sun & Moon Card -->
        <div class="card glass sun-card">
          <h3 class="card-title">☀️🌙</h3>
          <div class="sun-arc-wrap">
            <canvas id="sun-arc" width="280" height="140"></canvas>
          </div>
          <div class="sun-times">
            <div class="sun-time-item">
              <span class="sun-emoji">🌅</span>
              <span class="sun-label">Sunrise</span>
              <span class="sun-val" id="sunrise-val">—</span>
            </div>
            <div class="sun-time-item">
              <span class="sun-emoji">🌇</span>
              <span class="sun-label">Sunset</span>
              <span class="sun-val" id="sunset-val">—</span>
            </div>
          </div>
        </div>

        <!-- Detail Grid -->
        <div class="card glass detail-grid-card">
          <h3 class="card-title">⚡</h3>
          <div class="detail-grid" id="detail-grid">
            <div class="detail-item glass">
              <div class="detail-icon">☀️</div>
              <div class="detail-label">UV Index</div>
              <div class="detail-val" id="uv-val">—</div>
              <div class="detail-sub" id="uv-label">—</div>
            </div>
            <div class="detail-item glass">
              <div class="detail-icon">🌬</div>
              <div class="detail-label">Wind Dir.</div>
              <div class="detail-val" id="wind-dir-val">—</div>
              <div class="detail-sub" id="wind-gust-val">Gust —</div>
            </div>
            <div class="detail-item glass">
              <div class="detail-icon">🌫</div>
              <div class="detail-label">Dew Point</div>
              <div class="detail-val" id="dew-val">—</div>
              <div class="detail-sub">dew point</div>
            </div>
            <div class="detail-item glass">
              <div class="detail-icon">☁️</div>
              <div class="detail-label">Cloud Cover</div>
              <div class="detail-val" id="cloud-val">—</div>
              <div class="detail-sub">coverage</div>
            </div>
          </div>
        </div>

        <!-- Air Quality -->
        <div class="card glass aqi-card">
          <h3 class="card-title">AQI</h3>
          <div class="aqi-main">
            <div class="aqi-ring-wrap">
              <canvas id="aqi-ring" width="120" height="120"></canvas>
              <div class="aqi-center">
                <span id="aqi-val">—</span>
                <span id="aqi-label">—</span>
              </div>
            </div>
            <div class="aqi-pollutants" id="aqi-pollutants">
              <div class="pollutant-row"><span>PM2.5</span><span id="pm25">—</span></div>
              <div class="pollutant-row"><span>PM10</span><span id="pm10">—</span></div>
              <div class="pollutant-row"><span>CO</span><span id="co-val">—</span></div>
              <div class="pollutant-row"><span>O₃</span><span id="o3-val">—</span></div>
            </div>
          </div>
        </div>

        <!-- Recommendations -->
        <div class="card glass rec-card">
          <h3 class="card-title">Guide</h3>
          <div id="recommendations" class="rec-list"></div>
        </div>

        <!-- Recent Searches -->
        <div class="card glass history-card" id="history-card">
          <h3 class="card-title">Recent</h3>
          <div id="history-list" class="history-list"></div>
        </div>

        <!-- Favorites -->
        <div class="card glass favs-card hidden" id="favs-card">
          <h3 class="card-title">★</h3>
          <div id="favs-list" class="favs-list"></div>
        </div>

      </section>

    </main>

    <!-- Alert Banner -->
    <div id="alert-banner" class="alert-banner hidden glass">
      <span class="alert-icon">⚠️</span>
      <span id="alert-text">Alert</span>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/skycons/1396634940/skycons.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
